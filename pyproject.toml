[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-analysis-dubai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "python-dotenv",
    "coloredlogs",
    "cmake",
    "setuptools",
    "polars>=1.0,<2",
    "pytest",
    "jupyter",
    "requests-mock",
    "lib",
    "duckdb",
    "scrapy>=2.13.4",
    "pyarrow>=21.0.0",
    "pydantic>=2",
]

[dependency-groups]
dev = ["ruff", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["lib*"]
exclude = ["output*"]

[tool.uv.sources]
lib = { path = "./lib", editable = true }

[tool.ruff]
line-length = 120
exclude = ["output", "rents_scraper", ".venv", "build"]

[tool.ruff.lint]
# High-signal only: undefined names / unused imports (F) and syntax errors (E9),
# plus real-bug lints (B). Not a style gate.
select = ["F", "E9", "B"]
