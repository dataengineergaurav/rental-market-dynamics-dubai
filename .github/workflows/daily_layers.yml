name: Daily — Ingest layers (cumulative Silver+Gold DuckDB)

on:
  schedule:
    - cron: '0 7 * * *'  # daily 07:00 UTC — after the 05:30 bronze cron
  workflow_dispatch:
    inputs:
      data_date:
        description: 'Data date YYYY-MM-DD (default: yesterday)'
        required: false
        type: string

jobs:
  layers:
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: astral-sh/setup-uv@v5

      - name: Install deps
        run: pip install -q -r requirements.txt && pip install -q lib/ && pip install -q duckdb pyarrow

      - name: Resolve data date
        run: |
          DATE="${{ inputs.data_date }}"
          if [ -z "$DATE" ]; then DATE=$(date -u -d "yesterday" +%Y-%m-%d); fi
          echo "DATA_DATE=$DATE" >> $GITHUB_ENV
          echo "data date: $DATE"

      - name: Refresh previous layers DuckDB (from an earlier dated release)
        run: |
          mkdir -p output
          # The store is cumulative and lives in the day's release, so pull the most recent
          # release (within 30 days) that actually carries it, then upsert today's contracts.
          # A quiet day still has a release but no DB asset, so skip forward past gaps.
          for i in $(seq 0 30); do
            D=$(date -u -d "$DATA_DATE - $i days" +%Y-%m-%d)
            if gh release download "release-$D" \
                 --repo dataengineergaurav/rental-market-dynamics-dubai \
                 --pattern "rents_layers.duckdb" --dir output --clobber 2>/dev/null; then
              echo "pulled prior layers from release-$D"; break
            fi
          done
          ls -lh output/rents_layers.duckdb 2>/dev/null || echo "no prior layers (cold start)"

      - name: Download today's bronze CSV
        run: |
          gh release download "release-$DATA_DATE" \
            --repo dataengineergaurav/rental-market-dynamics-dubai \
            --pattern "rent_contracts_*.csv" --dir output --clobber \
            || echo "no CSV for release-$DATA_DATE (quiet day)"
          ls -lh output/rent_contracts_*.csv || true

      - name: Ingest into the cumulative layers DuckDB
        run: |
          CSV=$(ls -t output/rent_contracts_*.csv 2>/dev/null | head -1)
          if [ -z "$CSV" ]; then echo "No CSV to ingest (quiet day) — nothing to do"; exit 0; fi
          echo "Ingesting $CSV"
          uv run python -m lib.analysis.build_layers_duckdb --db output/rents_layers.duckdb --csv "$CSV"
          uv run python - << 'PY'
          import duckdb
          c = duckdb.connect("output/rents_layers.duckdb", read_only=True)
          print("_meta:", c.execute("SELECT * FROM _meta").fetchall())
          print("FctContract:", c.execute("SELECT count(*) FROM FctContract").fetchone())
          # every view must resolve on a plain connection — no attach, no silver alias
          print("gold_area_median:", c.execute("SELECT * FROM gold_area_median LIMIT 3").fetchall())
          print("AggMonthlyRegistrations:", c.execute("SELECT * FROM AggMonthlyRegistrations").fetchall())
          c.close()
          PY

      - name: Publish layers into the day's release
        if: hashFiles('output/rents_layers.duckdb') != ''
        run: |
          # Same tag the bronze CSV is published to: one release per day holds the raw CSV and
          # the combined DuckDB together.
          uv run python -m lib.workspace.publish_layers \
            --artifact output/rents_layers.duckdb --tag "release-$DATA_DATE"

      - name: Run tests
        run: uv run pytest -q
