name: Dev - Build and Deploy

on:
  push:
    branches:
      - dev
      - main
    tags: 
      - '*'

jobs:
  run_job: 
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Build and test only. The ETL that extracts and publishes the bronze release must NOT run
      # on push: it re-extracts the current window and clobbers the day's release, racing the
      # scheduled jobs. Releases are written only by cron.yml and daily_layers.yml.
      - name: Build and test
        run: |
          make build
          make test
