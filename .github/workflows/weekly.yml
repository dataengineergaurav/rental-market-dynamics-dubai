name: Weekly — Build DuckDB (Mon-Sun pooled)

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC — after Sunday week closes, before daily cron
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week like 2026W37 (default: previous week)'
        required: false
        type: string

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: astral-sh/setup-uv@v5

      - name: Install deps
        run: pip install -q -r requirements.txt && pip install -q lib/ && pip install -q duckdb pyarrow

      - name: Rehydrate daily CSVs from Releases (target week Mon-Sun)
        run: |
          WEEK="${{ inputs.week }}"
          if [ -z "$WEEK" ]; then WEEK=$(date -d "7 days ago" +%GW%V); fi
          [[ "$WEEK" =~ ^[0-9]{4}W[0-9]{2}$ ]] || { echo "bad week: $WEEK (want YYYYWNn)"; exit 1; }
          echo "WEEK=$WEEK" >> $GITHUB_ENV
          # Monday of target ISO week — single source of truth in lib (same Jan-4 algorithm as week_to_dates)
          MON=$(python3 -c "from lib.analysis.weekly_pool import week_to_dates; print(week_to_dates('$WEEK')[0])")
          echo "MON=$MON" >> $GITHUB_ENV
          for i in 0 1 2 3 4 5 6; do
            tag="release-$(date -d "$MON +$i days" +%Y-%m-%d)"
            gh release download "$tag" --repo dataengineergaurav/rental-market-dynamics-dubai --pattern "rent_contracts_*.csv" --dir output --clobber || echo "no asset for $tag"
          done
          ls -lh output/rent_contracts_*.csv || true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Build weekly layers (Silver tables + Gold views)
        run: |
          WEEK="${{ inputs.week }}"
          if [ -z "$WEEK" ]; then WEEK=$(date -d "7 days ago" +%GW%V); fi
          export WEEK
          echo "WEEK=$WEEK" >> $GITHUB_ENV
          # prefer ISO week; fallback to explicit from/to of the same Mon-Sun week for partial weeks
          uv run python -m lib.analysis.build_weekly_duckdb --week "$WEEK" || \
            uv run python -m lib.analysis.build_weekly_duckdb --from $(date -d "$MON" +%Y%m%d) --to $(date -d "$MON +6 days" +%Y%m%d)
          ls -lh output/silver_*.duckdb output/gold_*.duckdb
          uv run python - << 'PY'
          import duckdb, glob, os, pathlib
          week = os.environ['WEEK']
          silver = f"output/silver_{week}.duckdb"
          gold = f"output/gold_{week}.duckdb"
          # fallback if the week label differed — pick newest
          if not pathlib.Path(silver).exists():
              silver = sorted(glob.glob("output/silver_*.duckdb"))[-1]
          if not pathlib.Path(gold).exists():
              gold = sorted(glob.glob("output/gold_*.duckdb"))[-1]
          c = duckdb.connect(silver, read_only=True)
          print("_meta:", c.execute("SELECT * FROM _meta").fetchall())
          print("FctContract:", c.execute("SELECT count(*) FROM FctContract").fetchone())
          c.close()
          c = duckdb.connect(gold, read_only=True)
          c.execute(f"ATTACH '{silver}' AS silver (READ_ONLY)")
          print("gold_area_median:", c.execute("SELECT area_name_en, n, median_rent FROM gold_area_median LIMIT 3").fetchall())
          print("AggAreaRentStats rows:", c.execute("SELECT count(*) FROM AggAreaRentStats").fetchone())
          c.close()
          PY

      - name: Publish Silver and Gold to Releases
        run: |
          # Resolve the week from the workflow input exactly like the build step. Reading it back
          # out of $GITHUB_ENV silently fell through to the "previous week" fallback and tagged the
          # wrong week, so the tag and the asset disagreed.
          WEEK="${{ inputs.week }}"
          [ -n "$WEEK" ] || WEEK=$(date -d "7 days ago" +%GW%V)
          for L in silver gold; do
            FILE="output/${L}_${WEEK}.duckdb"
            [ -f "$FILE" ] || { echo "missing $FILE — refusing to publish a mislabelled asset"; exit 1; }
            TAG="release-${L}-${WEEK}"
            gh release view "$TAG" --repo dataengineergaurav/rental-market-dynamics-dubai >/dev/null 2>&1 || \
              gh release create "$TAG" --repo dataengineergaurav/rental-market-dynamics-dubai --title "${L} ${WEEK}" --notes "Weekly ${L} layer ${WEEK} — $(basename "$FILE")" --latest=false
            gh release upload "$TAG" "$FILE" --repo dataengineergaurav/rental-market-dynamics-dubai --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Run tests
        run: uv run pytest -q
